# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
    # enable version updates for npm
    - package-ecosystem: "npm"
      # look for `package.json` and `lock` files in the `root` directory
      directory: "/"
      target-branch: "master"
      schedule:
          interval: "monthly"
          timezone: "America/Sao_Paulo"
      # only ever keep one open Dependabot PR at a time
      open-pull-requests-limit: 1
      commit-message:
          # Prefix all commit messages with "[npm]: "
          prefix: "[npm]"
      # wait until a release has been public for N days before proposing it
      cooldown:
          default-days: 30
          semver-major-days: 90
          semver-minor-days: 30
          semver-patch-days: 7
      groups:
          packages:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
      ignore:
          # disable all major version updates; `@types/node` must track the Node
          # line pinned in `mise.toml`, and major bumps are risky for a repo that
          # is not actively maintained. Security updates can still bump a major.
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
